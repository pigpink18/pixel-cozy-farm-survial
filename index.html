<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1d1d27" />
    <title>Ashen Acre — Vườn Tàn Tro</title>
    <meta name="apple-mobile-web-app-title" content="Ashen Acre" />
    <meta name="application-name" content="Ashen Acre" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <style>
      @font-face { font-family: 'VT323'; src: url('fonts/VT323-Regular.ttf?v=2') format('truetype'); font-display: block; }
      @font-face { font-family: 'AshenGlyphs'; src: url('fonts/AshenGlyphs.ttf') format('truetype'); font-display: block; }
      html, body {
        margin: 0; height: 100%; background: #1d1d27; overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      canvas { image-rendering: pixelated; display: block; }
      /* Điện thoại cầm dọc / khoá xoay màn hình: xoay cả game 90° để luôn nằm ngang (xem src/rotate.js) */
      #game.rot { position: fixed; top: 0; transform-origin: 0 0; transform: rotate(90deg); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
