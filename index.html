<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1d1d27" />
    <title>Nông Trại Nhỏ</title>
    <link rel="icon" href="data:," />
    <style>
      @font-face { font-family: 'VT323'; src: url('fonts/VT323-Regular.ttf') format('truetype'); font-display: block; }
      html, body {
        margin: 0; height: 100%; background: #1d1d27; overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      canvas { image-rendering: pixelated; display: block; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #1d1d27; color: #ffe9a8; font: bold 20px "Trebuchet MS", Verdana, sans-serif;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
      }
      #rotate .phone {
        width: 46px; height: 80px; border: 4px solid #f4b467; border-radius: 10px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      /* Điện thoại/máy tính bảng cầm dọc → yêu cầu xoay ngang */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <div>Hãy xoay ngang điện thoại để chơi</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
